name: LYMELVA static quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Static clinical content and runtime checks
        run: npm run build
      - name: Install headless browser test driver
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Repeated Chrome desktop cinematic and scroll regression checks
        run: |
          for attempt in 1 2 3; do
            echo "Chrome motion test attempt ${attempt}/3"
            node tests/browser-motion.mjs
          done

      - name: Desktop smooth-scroll performance regression
        run: node tests/browser-performance.mjs
      - name: Chrome mobile navigation and email form integration
        run: node tests/browser-contact.mjs

      - name: Inspect production in real mobile and Brave desktop-request modes
        run: node tests/mobile-layout-diagnostic.mjs
